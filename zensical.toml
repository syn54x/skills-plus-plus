# Site config for docs/ (Zensical). Skill pages live at docs/skills/<name>.md and
# need a nav entry here, labelled with the skill name, because the pages carry no
# H1 and the site takes their title from the label (see .agents/writing-docs.md).
# Build: uv run --frozen zensical build --clean --strict   Preview: uv run zensical serve

[project]
site_name = "spp"
site_description = "A spec-driven delivery system on GitHub Issues, as a Claude Code plugin and a command-line tool"
site_url = "https://skills.x54.sh/"
repo_url = "https://github.com/syn54x/skills-plus-plus"
repo_name = "syn54x/skills-plus-plus"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
]

[project.theme]
language = "en"
features = [
  "navigation.tabs",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.footer",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "content.action.edit",
  "content.action.view",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/syn54x/skills-plus-plus"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
