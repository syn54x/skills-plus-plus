# Run with prek: `prek install` once, then hooks run on commit. `prek run --all-files` on demand.
repos:
  - repo: local
    hooks:
      - id: check-plugin-skills
        name: promoted skills are listed in plugin.json, docs/ and README.md
        entry: scripts/check-plugin-skills.sh
        language: script
        pass_filenames: false
        files: ^(skills/.+/SKILL\.md|docs/.+\.md|README\.md|\.claude-plugin/plugin\.json)$
      - id: check-invocation
        name: invocation flags agree and no skill calls a user-invoked skill
        entry: scripts/check-invocation.py
        language: script
        pass_filenames: false
        files: ^(skills/.+|agents/.+\.md)$
