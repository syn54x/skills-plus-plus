# Run with prek: `prek install` once, then hooks run on commit. `prek run --all-files` on demand.
repos:
  - repo: local
    hooks:
      - id: check-plugin-skills
        name: promoted skills are listed in plugin.json, docs/ and README.md
        entry: scripts/check-plugin-skills.sh
        language: script
        pass_filenames: false
        files: ^(skills/.+/SKILL\.md|docs/.+\.md|README\.md|\.claude-plugin/plugin\.json|zensical\.toml)$
      - id: check-invocation
        name: invocation flags agree and no skill calls a user-invoked skill
        entry: scripts/check-invocation.py
        language: script
        pass_filenames: false
        files: ^(skills/.+|agents/.+\.md)$
      - id: zensical-build
        name: docs site builds with no broken links (zensical --strict)
        entry: uv run --frozen zensical build --clean --strict
        language: system
        pass_filenames: false
        files: ^(docs/.+|zensical\.toml|pyproject\.toml|uv\.lock)$
