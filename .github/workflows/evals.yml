name: evals

# Runs the skill evals against a no-plugin baseline. Every case is a real model
# call, so this runs on the Changesets release pull request and on demand,
# never on every pull request. release.yml dispatches it on changeset-release/main
# whenever it opens or updates the release pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: skill evals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Claude Code accepts either credential: an API key, or the org's Claude Code OAuth token.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: check the model credential
        id: credential
        run: |
          if [ -z "$ANTHROPIC_API_KEY$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::notice::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set; skipping the evals."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credential.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.credential.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.credential.outputs.present == 'true'
        name: install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - if: steps.credential.outputs.present == 'true'
        name: run the suite against the baseline
        run: |
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --allow-tools Write Edit \
            --json evals/results.json \
            --threshold 0.8 \
            --model claude-sonnet-5 \
            --judge-model claude-haiku-4-5 \
            --no-publish \
            --max-cost-usd 20
      - if: always() && steps.credential.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            evals/results.json
            evals/results/
          if-no-files-found: ignore
