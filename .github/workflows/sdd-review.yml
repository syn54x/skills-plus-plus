# Review gate for pull requests the cloud worker opened. The job runs only when the PR's author is
# a bot (the app the sdd-implement worker pushes as); a local epic slice or local one-off is opened
# by a person and is gated by build-epic's own reviewer or a human, so CI leaves it alone.
# Runs /review-pr from the skills-plus-plus plugin: two verdicts (spec, quality), posts them on the PR.
# claude_args grants unrestricted Bash: the reviewer re-runs the ticket's Verify block, and an
# allowlist would have to name every consuming repo's toolchain. The runner is isolated and the
# token is scoped to this repo; a repo that wants a narrower list edits --allowedTools after copying.
name: sdd-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write   # only needed for OIDC auth; harmless otherwise

concurrency:
  group: sdd-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.event.pull_request.head.ref, 'sdd/') &&
      github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # --- auth: pick ONE -------------------------------------------------
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          # anthropic_organization_id:    ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          # ---------------------------------------------------------------------
          track_progress: true
          # every PR this gate reviews is opened by the sdd-implement worker, which GitHub reports as
          # the claude bot; the action allows no bots by default
          allowed_bots: claude
          plugins: |
            skills-plus-plus@syn54x
          plugin_marketplaces: |
            https://github.com/syn54x/skills-plus-plus.git
          prompt: |
            /review-pr ${{ github.event.pull_request.number }}
          claude_args: |
            --max-turns 40
            --allowedTools "Bash,Read,Edit,MultiEdit,Write,Glob,Grep,Skill,Agent,TodoWrite,WebFetch"
