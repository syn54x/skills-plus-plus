# Cloud path for a one-off size:S ticket outside an epic.
# Fires when an issue completes the pair `ready-for-agent` and `size:S`, in either order or in
# one edit; the job guard keeps it to an open issue with no `claimed` label, no assignee and no parent.
# The worker claims the ticket itself with the `claimed` label, so a second run from twin label
# events waits on the concurrency group and stops at the skill's readiness check.
# The job guard is the only gate. The action sets no label trigger and no progress tracking, so
# its `prompt` input runs it in agent mode, which does not skip a run started by `size:S`.
# Runs the same /implement-issue skill the local workers use, via the skills-plus-plus plugin.
name: sdd-implement

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write   # only needed for OIDC auth; harmless otherwise

concurrency:
  group: sdd-implement-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    # A sub-issue of an epic builds locally in build-epic's waves, which merge onto one
    # integration branch and check parallel safety; a cloud worker would bypass both.
    # The issue object carries parent_issue_url only when a parent is set.
    if: >-
      (github.event.label.name == 'ready-for-agent' || github.event.label.name == 'size:S') &&
      contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      contains(github.event.issue.labels.*.name, 'size:S') &&
      github.event.issue.state == 'open' &&
      !contains(github.event.issue.labels.*.name, 'claimed') &&
      github.event.issue.assignee == null &&
      github.event.issue.parent_issue_url == null
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # --- auth: pick ONE -------------------------------------------------
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # OIDC workload identity instead of a static key (needs id-token: write):
          # anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          # anthropic_organization_id:    ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          # ---------------------------------------------------------------------
          branch_prefix: sdd/
          plugins: |
            skills-plus-plus@syn54x
          plugin_marketplaces: |
            https://github.com/syn54x/skills-plus-plus.git
          prompt: |
            /implement-issue ${{ github.event.issue.number }}
          claude_args: |
            --max-turns 80
