name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Opens or updates the version pull request; once it merges, publishes to npm with provenance
      # (the NPM_TOKEN secret), or only tags the release when that secret is not set.
      - uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: version spp"
          title: "chore: version spp"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
