name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1 or later, and Node 22 ships npm 10.
      - run: npm install --global npm@11
      - run: npm ci
      # Opens or updates the version pull request; once it merges, publishes to npm through trusted
      # publishing: npm trades this job's OIDC token (id-token: write) for a publish, with provenance, and no secret is stored.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: version spp"
          title: "chore: version spp"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release pull request is opened with GITHUB_TOKEN, which starts no pull_request run, so dispatch the evals on it.
      - name: run the evals on the release pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        run: gh workflow run evals.yml --ref changeset-release/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
