name: incumbent watch

# Keeps the pinned "Incumbent watch" issue current, following .agents/incumbent-watch.md.
# It runs here rather than as a cloud routine because the routine sandbox reaches only
# the repositories attached to it and blocks gh's GraphQL calls.
on:
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install Claude Code
        run: npm install --global @anthropic-ai/claude-code
      - name: run the watch
        run: |
          claude -p "Follow .agents/incumbent-watch.md." \
            --model claude-sonnet-5-5 \
            --allowedTools Bash Read Write Glob Grep WebFetch
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
